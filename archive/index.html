<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tianyi Gao | Archive</title>
  <style>
    :root { --ink:#202020; --muted:#6a6a6a; --line:#d9d9d9; --accent:#7b1e1e; }
    * { box-sizing:border-box; } html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); font:16px/1.7 Georgia,"Times New Roman","Noto Serif SC",serif; }
    a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; text-underline-offset:3px; }
    .modebar { min-height:64px; display:flex; align-items:center; border:0; background:#fff; font:26px/1.2 "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif; }
    .modebar .modes { width:min(1180px,100%); margin:0 auto; padding:0 34px; }
    .site { max-width:1180px; margin:0 auto; padding:16px 34px 70px; display:grid; grid-template-columns:255px minmax(0,1fr); gap:38px; }
    aside { position:sticky; top:36px; align-self:start; }
    h1,h2,h3 { font-family:Arial,"Noto Sans SC",sans-serif; font-weight:600; letter-spacing:-.02em; }
    h1 { margin:0 0 20px; font-size:27px; } h2 { margin:0 0 17px; font-size:23px; }
    aside > nav { border-top:1px solid var(--line); padding-top:13px; font:14px/2 Arial,"Noto Sans SC",sans-serif; }
    aside > nav a { display:block; color:var(--ink); } aside > nav a:hover,aside > nav a.active { color:var(--accent); }
    .social-links { margin-top:27px; padding-top:13px; border-top:1px solid var(--line); font:13px/2 Arial,"Noto Sans SC",sans-serif; }.social-links a { display:block; color:var(--muted); }.social-links a:hover { color:var(--accent); }
    main { position:relative; min-width:0; }.topline { display:flex; justify-content:space-between; gap:20px; padding-bottom:18px; border-bottom:1px solid var(--line); color:var(--muted); font:13px/1.4 Arial,"Noto Sans SC",sans-serif; }
    .modes { display:flex; gap:16px; }.modes a { color:var(--ink); }.modes a.active { color:var(--ink); font-weight:400; text-decoration:none; }
    section { padding-top:0; }.archive-home,.archive-section { position:absolute; inset:0; display:block; visibility:hidden; opacity:0; pointer-events:none; transition:opacity .18s ease,visibility 0s linear .18s; }.archive-home.active,.archive-section.active { position:relative; inset:auto; visibility:visible; opacity:1; pointer-events:auto; animation:archive-content-enter .25s ease both; transition:opacity .18s ease; }.intro { font-size:18px; }.eyebrow { color:var(--muted); font:13px/1.5 Arial,"Noto Sans SC",sans-serif; text-transform:uppercase; letter-spacing:.06em; }
    .archive-hero { width:100%; max-height:540px; display:flex; justify-content:flex-start; align-items:flex-start; overflow:hidden; background:transparent; }
    .archive-hero img { display:block; max-width:100%; max-height:540px; }
    .archive-motto { margin:24px 0 0; color:var(--muted); font:italic 19px/1.75 Georgia,"Times New Roman","Noto Serif SC",serif; }
    @keyframes archive-content-enter { from { opacity:0; } to { opacity:1; } }
    .archive-section h2 + .eyebrow { margin-top:-12px; }
    .archive-section > .eyebrow + * { margin-top:26px; }
    .posts { border-top:1px solid var(--line); }.post { display:grid; grid-template-columns:110px 1fr; gap:18px; padding:17px 0; border-bottom:1px solid var(--line); }.post h3 { margin:0; font-size:18px; }.post p { margin:4px 0 0; color:var(--muted); font-size:14px; }
    .album-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; }.album { min-height:180px; padding:14px; display:flex; flex-direction:column; justify-content:flex-end; border:1px solid var(--line); background:linear-gradient(145deg,#d6d2ca,#f7f5f0 56%,#a7a099); color:#1d1d1d; text-align:left; cursor:pointer; font:inherit; }.album.active { outline:2px solid var(--ink); outline-offset:-4px; }.album:nth-child(2) { background:linear-gradient(145deg,#9eafbd,#edf0ef 58%,#55646b); }.album:nth-child(3) { background:linear-gradient(145deg,#b59985,#f2e6d6 58%,#746258); }.album strong { font-family:Arial,"Noto Sans SC",sans-serif; }.album span { font:12px Arial,"Noto Sans SC",sans-serif; }
    .photo-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; }.photo { aspect-ratio:1; border:1px solid var(--line); background:repeating-linear-gradient(135deg,#e8e8e4 0 12px,#d3d3ce 12px 24px); display:grid; place-items:center; color:var(--muted); font:12px Arial,"Noto Sans SC",sans-serif; }
    .music-heading { margin:28px 0 12px; font-size:16px; }.music { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }.record { position:relative; aspect-ratio:1; overflow:hidden; background:linear-gradient(145deg,#29262a,#8c1b2f 49%,#e7cb9b); }.record img { display:block; width:100%; height:100%; object-fit:cover; }.record:nth-child(2) { background:linear-gradient(145deg,#6e8c99,#f0d9b2 52%,#1c3848); }.record:nth-child(3) { background:linear-gradient(145deg,#dad6ca,#8c8273 49%,#272b2d); }.record::after { content:""; position:absolute; inset:15%; border:1px solid rgba(255,255,255,.65); border-radius:50%; pointer-events:none; }.record-info { position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; justify-content:flex-end; padding:15px; background:rgba(20,20,20,.86); color:#fff; opacity:0; transition:opacity .2s ease; font:13px/1.5 Arial,"Noto Sans SC",sans-serif; }.record:hover .record-info,.record:focus-within .record-info { opacity:1; }.record-info strong { font-size:16px; }
    .music-block { margin-top:26px; }.music-block:first-child { margin-top:0; }.music-toggle { margin-top:14px; border:0; padding:0; background:transparent; color:var(--muted); font:13px Arial,"Noto Sans SC",sans-serif; cursor:pointer; }.music-toggle:hover { color:var(--accent); }.music-grid.collapsed .record:nth-child(n+4) { display:none; }
    .quotes,.others { display:grid; grid-template-columns:repeat(2,1fr); gap:15px; }.quote,.other { min-height:150px; padding:20px; border:1px solid var(--line); display:flex; flex-direction:column; justify-content:space-between; }.quote { font-size:20px; line-height:1.55; }.quote cite,.other small { color:var(--muted); font:12px Arial,"Noto Sans SC",sans-serif; font-style:normal; }.other { color:var(--ink); text-decoration:none; }.other:hover { border-color:var(--ink); text-decoration:none; }.other h3 { margin:0; font-size:17px; }.other p { margin:7px 0; color:var(--muted); font-size:14px; }
    .quote-carousel { position:relative; min-height:444px; overflow:hidden; }
    .quote-slide { position:absolute; top:50%; left:50%; width:min(816px, 100%); height:324px; min-width:0; margin:0; padding:30px 58px; overflow:hidden; border:1px solid var(--line); display:flex; flex-direction:column; justify-content:center; font-size:20px; line-height:1.7; transition:opacity .3s ease, filter .3s ease, transform .3s ease; transform:translate(-50%, -50%); }
    .quote-slide[data-quote="current"] { z-index:2; }
    .quote-slide.side { display:none; }
    .quote-slide.empty { visibility:hidden; }
    .quote-slide cite { position:absolute; right:58px; bottom:22px; left:58px; color:var(--muted); font:12px Arial,"Noto Sans SC",sans-serif; font-style:normal; text-align:right; }
    .quote-text { margin:0; overflow:hidden; white-space:pre-wrap; word-break:break-word; }
    .quote-controls { position:absolute; z-index:3; top:50%; left:50%; width:min(816px, 100%); display:flex; justify-content:space-between; pointer-events:none; transform:translate(-50%, -50%); }
    .quote-controls button { width:38px; height:46px; border:0; padding:0; background:transparent; color:var(--ink); font:24px/1 Arial,sans-serif; cursor:pointer; pointer-events:auto; }
    .quote-controls button:hover { color:var(--accent); }
    footer { margin-top:42px; padding-top:14px; border-top:1px solid var(--line); color:var(--muted); font:13px Arial,"Noto Sans SC",sans-serif; }
    @media(max-width:760px) { .modebar { min-height:56px; padding:0; font-size:17px; }.modebar .modes { padding:0 22px; }.site { display:block; padding:14px 22px 50px; } aside { position:static; margin-bottom:30px; }.archive-hero { height:auto; min-height:0; }.archive-motto { font-size:17px; }.topline { font-size:12px; }.album-grid,.music { grid-template-columns:repeat(2,1fr); }.photo-row { grid-template-columns:repeat(2,1fr); }.post { grid-template-columns:1fr; gap:3px; }.quotes,.others { grid-template-columns:1fr; }.quote-carousel { min-height:400px; }.quote-slide { width:100%; height:288px; padding:22px 48px; font-size:18px; }.quote-slide cite { right:48px; bottom:18px; left:48px; }.quote-controls { width:100%; }.quote-controls button { width:34px; } }
  </style>
  <link rel="stylesheet" href="../assets/css/lightbox.css">
</head>
<body>
  <div class="modebar"><nav class="modes" aria-label="Site mode"><a class="active archive-home-link" href="./">Archive</a></nav></div>
  <div class="site">
    <aside>
      <nav aria-label="Archive navigation">
        <a href="#photos" data-target="photos">Photos</a>
        <a href="#words" data-target="words">Words</a>
        <a href="#music" data-target="music">Music</a>
        <a href="#writing" data-target="writing">Writing</a>
        <a href="#other" data-target="other">Other</a>
        <a class="academic-return" href="../">← 学术主页</a>
      </nav>
      <div class="social-links" aria-label="Social links">
        <a href="https://space.bilibili.com/33266404?spm_id_from=333.1007.0.0" target="_blank" rel="noreferrer">Bilibili</a>
        <a href="https://music.163.com/#/user/home?id=408944720" target="_blank" rel="noreferrer">NetEase Cloud Music</a>
        <a href="https://www.xiaohongshu.com/user/profile/63cac9ff0000000026013aa4" target="_blank" rel="noreferrer">Xiaohongshu</a>
      </div>
    </aside>
    <main>
      <section class="archive-home active" id="archive-home"><div class="archive-hero"><img id="archive-image" alt="Archive background"></div><p class="archive-motto">爱天空，爱海洋<br>生活需要丰富的感受与表达</p></section>
      <section class="archive-section" id="writing"><h2>Writing</h2><div class="eyebrow">记录一些想法和故事</div><div class="posts"><article class="post"><time>—</time><div><h3>文章标题</h3><p>待填写。</p></div></article></div></section>
      <section class="archive-section" id="photos"><h2>Photos</h2><div class="eyebrow">拍的照片，一些喜欢的。</div><div class="album-grid"><button class="album active" type="button" data-album="相册"><strong>相册 01</strong><span>待填写</span></button><button class="album" type="button" data-album="相册"><strong>相册 02</strong><span>待填写</span></button><button class="album" type="button" data-album="相册"><strong>相册 03</strong><span>待填写</span></button></div><div class="photo-row" aria-live="polite"><div class="photo">图片</div><div class="photo">图片</div><div class="photo">图片</div><div class="photo">图片</div></div></section>
      <section class="archive-section" id="music"><h2>Music</h2><div class="eyebrow">喜欢的一些音乐</div><div id="music-content"></div></section>
      <section class="archive-section" id="words"><h2>Words</h2><div class="eyebrow">记录随心写下和摘抄的句子</div><div class="quote-carousel"><div class="quote-slide side" data-quote="previous"><p class="quote-text"></p><cite></cite></div><blockquote class="quote-slide" data-quote="current"><p class="quote-text">正在加载……</p><cite></cite></blockquote><div class="quote-slide side" data-quote="next"><p class="quote-text"></p><cite></cite></div><div class="quote-controls"><button type="button" data-quote-step="-1" aria-label="上一句">←</button><button type="button" data-quote-step="1" aria-label="下一句">→</button></div></div></section>
      <section class="archive-section" id="other"><h2>Other</h2><div class="eyebrow">一些难以归类的东西</div><div class="others" id="other-items"></div></section>
      <footer>© 2026 Tianyi Gao.</footer>
    </main>
  </div>
  <script>
    const archiveHome = document.querySelector('#archive-home');
    const archiveHomeLink = document.querySelector('.archive-home-link');
    const archiveHero = document.querySelector('.archive-hero');
    const archiveImage = document.querySelector('#archive-image');
    let backgroundFiles = [];
    let currentBackground = '';
    function showRandomBackground() {
      if (!backgroundFiles.length) return;
      let nextBackground = backgroundFiles[Math.floor(Math.random() * backgroundFiles.length)];
      if (backgroundFiles.length > 1 && nextBackground === currentBackground) {
        nextBackground = backgroundFiles[(backgroundFiles.indexOf(nextBackground) + 1) % backgroundFiles.length];
      }
      currentBackground = nextBackground;
      archiveImage.src = `../assets/img/background/${encodeURIComponent(nextBackground)}`;
    }
    function fitArchiveImage() {
      if (!archiveImage.naturalWidth || !archiveImage.naturalHeight) return;
      const maxWidth = archiveHero.clientWidth;
      const maxHeight = 540;
      const scale = Math.min(maxWidth / archiveImage.naturalWidth, maxHeight / archiveImage.naturalHeight);
      archiveImage.style.width = `${archiveImage.naturalWidth * scale}px`;
      archiveImage.style.height = `${archiveImage.naturalHeight * scale}px`;
    }
    archiveImage.addEventListener('load', fitArchiveImage);
    window.addEventListener('resize', fitArchiveImage);
    function showArchiveView(target) {
      archiveHome.classList.toggle('active', target === 'home');
      document.querySelectorAll('[data-target]').forEach((item) => item.classList.toggle('active', item.dataset.target === target));
      document.querySelectorAll('.archive-section').forEach((section) => section.classList.toggle('active', section.id === target));
      if (target === 'home') showRandomBackground();
    }
    archiveHomeLink.addEventListener('click', (event) => { event.preventDefault(); showArchiveView('home'); history.replaceState(null, '', './'); });
    const backgroundManifest = '../assets/img/background/backgrounds.json';
    const backgroundDirectoryApi = 'https://api.github.com/repos/CKTtari/CKTtari.github.io/contents/assets/img/background?ref=main';
    const backgroundDirectory = '../assets/img/background/';
    function loadLocalBackgrounds() {
      return fetch(backgroundDirectory)
        .then((response) => { if (!response.ok) throw new Error('Unable to read local background directory'); return response.text(); })
        .then((html) => Array.from(new DOMParser().parseFromString(html, 'text/html').querySelectorAll('a'))
          .map((link) => decodeURIComponent(link.getAttribute('href') || ''))
          .filter((name) => /\.(jpe?g|png|webp|gif)$/i.test(name)));
    }
    function loadBackgrounds() {
      const isLocalPreview = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
      if (isLocalPreview) {
        return loadLocalBackgrounds().catch(() => fetch(backgroundManifest)
          .then((response) => { if (!response.ok) throw new Error('Unable to load background manifest'); return response.json(); }));
      }
      return fetch(backgroundDirectoryApi)
        .then((response) => { if (!response.ok) throw new Error('Unable to scan background directory'); return response.json(); })
        .then((files) => files.filter((file) => /\.(jpe?g|png|webp|gif)$/i.test(file.name)).map((file) => file.name))
        .then((files) => { if (!files.length) throw new Error('No background images found'); return files; })
        .catch(() => fetch(backgroundManifest)
          .then((response) => { if (!response.ok) throw new Error('Unable to load background manifest'); return response.json(); }));
    }
    loadBackgrounds().then((files) => { backgroundFiles = files; showRandomBackground(); });
    document.querySelectorAll('[data-target]').forEach((link) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        showArchiveView(link.dataset.target);
        history.replaceState(null, '', `#${link.dataset.target}`);
      });
    });
    let quoteItems = [];
    let quoteIndex = 0;
    const quotePrevious = document.querySelector('[data-quote="previous"]');
    const quoteCurrent = document.querySelector('[data-quote="current"]');
    const quoteNext = document.querySelector('[data-quote="next"]');
    function renderQuote() {
      if (!quoteItems.length) return;
      const item = (offset) => quoteItems[(quoteIndex + offset + quoteItems.length) % quoteItems.length];
      const render = (element, value) => {
        element.querySelector('.quote-text').textContent = value.text.join('\n');
        element.querySelector('cite').textContent = value.source ? `— ${value.source}` : '';
      };
      render(quotePrevious, item(-1));
      render(quoteCurrent, item(0));
      render(quoteNext, item(1));
    }
    function shuffleQuotes(items) {
      const shuffled = [...items];
      for (let i = shuffled.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }
    document.querySelectorAll('[data-quote-step]').forEach((button) => {
      button.addEventListener('click', () => {
        if (!quoteItems.length) return;
        const step = Number(button.dataset.quoteStep);
        quoteIndex = (quoteIndex + step + quoteItems.length) % quoteItems.length;
        renderQuote();
      });
    });
    fetch('words/quotes.json')
      .then((response) => { if (!response.ok) throw new Error('Unable to load quotes'); return response.json(); })
      .then((quotes) => {
        quoteItems = shuffleQuotes(quotes);
        quoteIndex = 0;
        renderQuote();
      })
      .catch(() => { quoteCurrent.querySelector('.quote-text').textContent = '字句暂时无法加载。'; });
    fetch('other/items.json')
      .then((response) => { if (!response.ok) throw new Error('Unable to load items'); return response.json(); })
      .then((items) => {
        const container = document.querySelector('#other-items');
        container.replaceChildren(...items.map((item) => {
          const card = document.createElement('a');
          card.className = 'other';
          card.href = item.url;
          if (item.external) { card.target = '_blank'; card.rel = 'noreferrer'; }
          const title = document.createElement('h3'); title.textContent = item.title;
          const description = document.createElement('p'); description.textContent = item.description;
          const label = document.createElement('small'); label.textContent = item.label;
          card.append(title, description, label);
          return card;
        }));
      });
    fetch('../assets/img/music/music.json?v=2')
      .then((response) => { if (!response.ok) throw new Error('Unable to load music'); return response.json(); })
      .then((data) => {
        const container = document.querySelector('#music-content');
        data.sections.sort((a, b) => (a.id === 'recent' ? -1 : 1) - (b.id === 'recent' ? -1 : 1)).forEach((section) => {
          section.items.sort(() => Math.random() - 0.5);
          const block = document.createElement('div');
          block.className = 'music-block';
          const heading = document.createElement('h3');
          heading.className = 'music-heading';
          heading.textContent = section.title;
          const grid = document.createElement('div');
          grid.className = 'music music-grid collapsed';
          section.items.forEach((item) => {
            const record = document.createElement('article');
            record.className = 'record';
            record.tabIndex = 0;
            const cover = document.createElement('img');
            cover.src = `../assets/img/music/${encodeURIComponent(item.cover)}`;
            cover.alt = `${item.title} — ${item.artist}`;
            cover.loading = 'lazy';
            const info = document.createElement('div');
            info.className = 'record-info';
            const title = document.createElement('strong'); title.textContent = item.title;
            const detail = document.createElement('span'); detail.textContent = `${item.type} · ${item.artist}`;
            info.append(title, detail); record.append(cover, info); grid.append(record);
          });
          block.append(heading, grid);
          if (section.items.length > 3) {
            const toggle = document.createElement('button');
            toggle.className = 'music-toggle';
            toggle.type = 'button';
            toggle.textContent = '展开全部';
            toggle.addEventListener('click', () => {
              const expanded = grid.classList.toggle('collapsed') === false;
              toggle.textContent = expanded ? '收起' : '展开全部';
            });
            block.append(toggle);
          }
          container.append(block);
        });
      });
    document.querySelectorAll('.album').forEach((album) => {
      album.addEventListener('click', () => {
        document.querySelectorAll('.album').forEach((item) => item.classList.toggle('active', item === album));
        document.querySelector('.photo-row').innerHTML = [1, 2, 3, 4].map((number) => `<div class="photo">${album.dataset.album.toUpperCase()} 0${number}</div>`).join('');
      });
    });
  </script>
  <script src="../assets/js/lightbox.js"></script>
</body>
</html>
